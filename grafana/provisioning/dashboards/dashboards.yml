    orgId: 1
    folder: Sign Language Backend Logs
    folderUid: sign-language-backend-logs-folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /opt/sign-language-backend/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false

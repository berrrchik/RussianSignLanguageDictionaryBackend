name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main  # измените на master, если используете master
  workflow_dispatch:  # для ручного запуска

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to server
        run: |
          ssh appuser@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            echo "🚀 Starting deployment..."
            
            cd /opt/sign-language-backend
            
            # Сохраняем текущие изменения (если есть)
            git stash || true
            
            # Получаем последние изменения
            echo "📥 Fetching latest changes..."
            git fetch origin
            git reset --hard origin/main  # измените на master, если используете master
            
            # Обновляем виртуальное окружение
            echo "📦 Updating dependencies..."
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Применяем миграции БД (если есть)
            # echo "🗄️ Running migrations..."
            # source venv/bin/python scripts/migrate.py || true
            
            # Перезапускаем сервис
            echo "🔄 Restarting service..."
            sudo systemctl restart sign-language-backend
            
            # Проверяем статус
            echo "✅ Checking service status..."
            sleep 5
            sudo systemctl status sign-language-backend --no-pager
            
            echo "🎉 Deployment completed!"
          EOF
      
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          sleep 10
          curl -f http://${{ secrets.SERVER_HOST }}:5001/api/v1/sync/check || exit 1
          echo "✅ Deployment verified successfully!"

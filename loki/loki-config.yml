# Конфигурация Loki для сбора системных журналов
# Автор: Berchik Anastasia Sergeevna

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Конфигурация индексации данных
# Loki использует индексы для быстрого поиска по меткам (labels)
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Настройки хранилища
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

# Ограничения и лимиты
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 дней
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 10000
  max_entries_limit_per_query: 5000

# Конфигурация компактора для оптимизации хранения
compactor:
  working_directory: /loki/compactor

# Аналитика (отключена)
analytics:
  reporting_enabled: false

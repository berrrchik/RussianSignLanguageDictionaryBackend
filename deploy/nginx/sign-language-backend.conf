# Конфигурация Nginx для Sign Language Dictionary Backend
# Скопируйте этот файл в /etc/nginx/sites-available/sign-language-backend
# и создайте симлинк в /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name ваш-домен.ru;  # Замените на ваш домен или IP адрес

    client_max_body_size 50M;

    # Логирование
    access_log /var/log/nginx/sign-language-backend-access.log;
    error_log /var/log/nginx/sign-language-backend-error.log;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Для статических файлов (видео)
    # Структура: videos/signs/ и videos/lessons/
    location /videos/ {
        alias /opt/sign-language-backend/videos/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Разрешаем CORS для видео (если нужно)
        add_header Access-Control-Allow-Origin *;
    }

    # Для статических файлов (CSS, JS)
    location /static/ {
        alias /opt/sign-language-backend/static/;
        expires 7d;
        add_header Cache-Control "public";
    }
}


server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /opt/monitoring/promtail-positions.yml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  # Основной источник для dashboard: структурированные JSON-логи приложения.
  # Используем только application.log, а не journald/access.log, чтобы не дублировать
  # HTTP-запросы, которые уже логируются самим Flask приложением.
  - job_name: sign-language-backend-application
    static_configs:
      - targets:
          - localhost
        labels:
          job: sign-language-backend
          service: sign-language-backend
          source: file
          log_type: application
          __path__: /var/log/app/application.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            environment: environment
            request_id: request_id
            method: method
            path: path
            route: route
            endpoint: endpoint
            blueprint: blueprint
            status_code: status_code
            status_family: status_family
            duration_ms: duration_ms
            event_kind: event_kind
            event_domain: event_domain
            event_name: event_name
            resource: resource
            action: action
            outcome: outcome
            module: module
            function: function

      - labels:
          service:
          environment:
          log_type:
          level:
          method:
          route:
          blueprint:
          status_code:
          status_family:
          event_kind:
          event_domain:
          event_name:
          resource:
          action:
          outcome:

      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.999999Z"
            - "2006-01-02T15:04:05Z"

  # error.log собираем отдельно: это полезно для проблем Gunicorn worker/process,
  # которые не всегда попадают в application.log.
  - job_name: sign-language-backend-gunicorn-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: sign-language-backend
          service: sign-language-backend
          source: file
          log_type: gunicorn_error
          __path__: /var/log/app/error.log

    pipeline_stages:
      - regex:
          expression: '^\\[(?P<timestamp>[^\\]]+)\\] \\[(?P<pid>\\d+)\\] \\[(?P<level>[A-Z]+)\\] (?P<message>.*)$'

      - labels:
          level:

      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05 -0700"

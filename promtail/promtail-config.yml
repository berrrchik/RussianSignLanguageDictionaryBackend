# Конфигурация Promtail (sidecar) для сбора логов
# Автор: Berchik Anastasia Sergeevna
# 
# Promtail - агент для сбора логов и отправки в Loki
# Метод сбора: sidecar (читает логи из файлов и Docker)

server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Позиции - запоминает где остановился при чтении файлов
positions:
  filename: /tmp/positions.yaml

# Клиент для отправки в Loki
clients:
  - url: http://loki:3100/loki/api/v1/push
    # Таймауты и ретраи
    timeout: 10s
    batchwait: 1s
    batchsize: 1048576  # 1MB

# Конфигурация сбора логов
scrape_configs:
  # 1. Сбор логов приложения из файла
  - job_name: app_file_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: sign-language-app
          source: file
          author: berchik-as
          __path__: /var/log/app/*.log

    # Pipeline для обработки логов
    pipeline_stages:
      # Парсинг JSON логов
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            module: module
            function: function
            request_id: request_id
            method: method
            path: path
            status_code: status_code
            duration_ms: duration_ms

      # Добавление меток из распарсенных данных
      - labels:
          level:
          module:
          method:
          status_code:

      # Установка timestamp из лога
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.999999999Z07:00"
            - "2006-01-02 15:04:05"

      # Вывод сообщения
      - output:
          source: message

  # 2. Сбор логов из Docker контейнеров
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]

    relabel_configs:
      # Имя контейнера как метка
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Имя сервиса из compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Добавление метки автора
      - target_label: 'author'
        replacement: 'berchik-as'

    pipeline_stages:
      # Попытка парсинга JSON
      - json:
          expressions:
            level: level
            message: message
            module: module
          
      - labels:
          level:
          module:
